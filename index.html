<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#07030f">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horaly Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07030f;--mag:#ff2bd6;--vio:#8b5cf6;--tx:#f4eefe;--mut:#b7a9d6;--ok:#34e0a1;--warn:#ffb454;--capH:clamp(140px,25vh,210px);--ph:min(calc(100dvh - var(--capH) - 118px),640px,122vw);--pw:calc(var(--ph)*.49);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;height:100dvh;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation;margin:0;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden}
#stage{position:relative;height:100%;cursor:pointer;background:radial-gradient(circle at 0 0,rgba(255,43,214,.38),transparent 34%),radial-gradient(circle at 100% 100%,rgba(255,43,214,.34),transparent 36%),radial-gradient(ellipse at 50% 40%,#2a0f4d 0%,#12062a 45%,#07030f 82%)}
canvas{position:absolute;inset:0;width:100%;height:100%}
#bar{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--vio),var(--mag));transition:width .5s;z-index:9;box-shadow:0 0 12px var(--mag)}
#sec{position:absolute;top:12px;left:20px;max-width:calc(100vw - 170px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--mut);z-index:5}
#hint{position:absolute;top:12px;right:20px;font-size:11px;color:var(--mut);opacity:.8;z-index:5;animation:bl 2.4s infinite}
#foot{position:absolute;bottom:18px;left:0;right:0;display:none;justify-content:center;z-index:5;pointer-events:none}
[data-m=ph] #foot,[data-m=sim] #foot,[data-m=brain] #foot{display:flex}
#foot .logo{width:112px;filter:drop-shadow(0 0 8px var(--mag))}
@keyframes bl{50%{opacity:.25}}
/* intro */
#intro{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
[data-m=intro] #intro,[data-m=end] #intro{display:flex}
#intro>*{opacity:0;animation:up 1s forwards;max-width:min(680px,92vw);margin:0}
@keyframes up{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
h1{font-weight:800;font-size:clamp(30px,5.4vw,58px);line-height:1.08;letter-spacing:-.02em}
.p1{font-size:clamp(18px,2.4vw,26px);font-weight:600;color:#e6d4ff}
.p{font-size:clamp(15px,1.7vw,19px);color:var(--mut);line-height:1.6;font-weight:300}
.say{font-size:clamp(15px,1.8vw,20px);line-height:1.55;padding:14px 20px;border-radius:18px 18px 18px 4px;background:rgba(139,92,246,.16);border:1px solid rgba(255,43,214,.35);box-shadow:0 0 30px rgba(255,43,214,.15)}
.logo{width:min(400px,78vw);height:auto;filter:drop-shadow(0 0 18px var(--mag)) drop-shadow(0 0 44px rgba(139,92,246,.6))}
.wm{font-weight:800;font-size:22px;letter-spacing:.04em;color:#fff}
.star{width:70px;height:70px;animation:up 1s forwards,pulse 2.4s 1s infinite}
@keyframes pulse{50%{transform:scale(1.25);filter:drop-shadow(0 0 24px var(--mag))}}
.btn{pointer-events:auto;font:600 14px 'Plus Jakarta Sans',sans-serif;color:#fff;border:0;border-radius:99px;padding:12px 24px;background:linear-gradient(90deg,var(--vio),var(--mag));cursor:pointer;box-shadow:0 0 24px rgba(255,43,214,.45)}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{text-decoration:none;display:inline-block}
.btn.alt{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);box-shadow:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.nav{position:absolute;bottom:10px;width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center;z-index:6;cursor:pointer;color:#fff;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:opacity .3s,transform .2s}
.nav:active{transform:scale(.9)}.nav.off{opacity:0;pointer-events:none}
#prev{left:16px}#next{right:16px}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fl{position:absolute;font-size:12px;padding:7px 12px;border-radius:10px;background:rgba(139,92,246,.2);border:1px solid rgba(255,43,214,.3);color:#e9dcff;animation:fl 7s ease-in-out infinite alternate;z-index:0}
@keyframes fl{to{transform:translate(18px,-26px)}}
/* phone */
#pw{position:absolute;top:calc(44px + var(--capH));left:50%;width:var(--pw);height:var(--ph);margin-left:calc(var(--pw)/-2);perspective:1200px;opacity:0;transition:opacity .8s,transform .8s,filter .8s;pointer-events:none}
[data-m=ph] #pw,[data-m=sim] #pw{opacity:1}
[data-m=brain] #pw{opacity:.18;filter:blur(2px);transform:scale(.8)}
[data-m=brain].burst #pw{opacity:1;filter:none;transform:none}
#phone{position:absolute;inset:0;border-radius:calc(var(--pw)*.14);padding:calc(var(--pw)*.034);box-sizing:border-box;background:linear-gradient(145deg,#2b1747,#0c0618);box-shadow:0 0 0 1.5px #ff2bd677,0 0 60px rgba(255,43,214,.35),0 30px 80px #000;transform-style:preserve-3d}
#phone.enter{animation:ent 2.2s cubic-bezier(.2,.8,.2,1)}
@keyframes ent{from{transform:rotateY(-80deg) rotateX(14deg) scale(.5);opacity:0}60%{transform:rotateY(18deg)}to{transform:none;opacity:1}}
#scr{box-sizing:border-box;position:relative;height:100%;border-radius:calc(var(--pw)*.106);background:linear-gradient(180deg,#0e0a1c,#070411);overflow:hidden;padding:calc(var(--pw)*.07) calc(var(--pw)*.06) 0;font-size:calc(var(--pw)*.05)}
#phone::before{content:'';position:absolute;top:calc(var(--pw)*.05);left:50%;width:28%;height:calc(var(--pw)*.056);margin-left:-15%;background:#000;border-radius:99px;z-index:3}
#pw::before{content:'';position:absolute;left:-26%;right:-26%;bottom:-2.5%;height:7%;border-radius:50%;border:2px solid #ff5ae6;box-shadow:0 0 26px #ff2bd6,inset 0 0 26px #ff2bd6}
#sb{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.9em;padding:0 calc(var(--pw)*.03);margin-bottom:calc(var(--pw)*.065)}
#sb i{display:inline-block;width:1.5em;height:.7em;border:1.5px solid #fff;border-radius:3px;position:relative;margin-left:6px;vertical-align:middle}#sb i::after{content:'';position:absolute;inset:1.5px;background:#fff;border-radius:1px}
#tb{position:absolute;left:0;right:0;bottom:0;height:4.4em;display:flex;justify-content:space-around;align-items:center;padding:0 calc(var(--pw)*.07) .3em;box-sizing:border-box;background:rgba(10,6,20,.97);border-top:1px solid rgba(255,255,255,.07);font-size:.72em;color:#b9b0cf}
#tb div{display:flex;flex-direction:column;align-items:center;gap:3px}#tb .on{color:#ff2bd6}
#tb svg{width:2em;height:2em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#app h4{margin:0 0 10px;font-size:1.2em;font-weight:800}
#app>div{animation:fi .5s}
@keyframes fi{from{opacity:0}}
.row{position:relative;display:grid;grid-template-columns:3.3em 1fr auto;gap:8px;align-items:center;padding:10px 12px;margin-bottom:9px;border-radius:12px;background:#10101c;border:1px solid rgba(255,255,255,.05);transition:all .5s}
.row b{color:#f1ecff;font-weight:600}
.row b::after{content:'';display:block;width:8px;height:8px;border-radius:50%;background:#38d6f2;margin-top:7px}
.row span{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{display:block;color:#cdc4e4;font-size:.84em;font-weight:400;margin-top:2px}
.row i{white-space:nowrap;font-style:normal;font-size:.78em;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(139,92,246,.25);color:#e2d4ff;border:1px solid rgba(139,92,246,.5)}
.row.ok{box-shadow:0 0 0 1px rgba(47,227,181,.55)}.row.ok i{background:rgba(47,227,181,.14);color:#2fe3b5;border-color:rgba(47,227,181,.6)}
.row.warn i{background:rgba(255,180,84,.16);color:var(--warn);border-color:rgba(255,180,84,.6)}
.row.risk{background:linear-gradient(90deg,#9a1236,#5c0b25);box-shadow:0 0 18px rgba(255,43,74,.35)}.row.risk i{background:#ff2b4a;color:#fff;border-color:#ff2b4a}
.row.hl{background:linear-gradient(90deg,#d9139f,#7b1bd8);border-color:#ff9cf0;box-shadow:0 0 0 1.5px var(--mag),0 0 22px rgba(255,43,214,.6);animation:gl 1.6s infinite alternate}
.row.hl b::after{background:#fff}.row.hl small{color:#fff}.row.hl i{background:rgba(0,0,0,.25);color:#fff;border-color:rgba(255,255,255,.5)}
.row.hl::after{content:'⚡';position:absolute;top:-9px;right:-5px;width:1.7em;height:1.7em;border-radius:50%;background:#ff2bd6;display:grid;place-items:center;box-shadow:0 0 12px #ff2bd6;font-size:.9em}
@keyframes gl{to{box-shadow:0 0 0 1.5px var(--mag),0 0 8px rgba(255,43,214,.25)}}
.row.free{border:1.5px dashed var(--mag);background:transparent}
.map svg{width:100%;border-radius:14px;background:#120824}
.svc{font-size:1.1em;padding:14px;border-radius:14px;background:rgba(255,255,255,.06)}
.svc b{font-size:2em;display:block;color:var(--mag)}
/* card */
#card{position:absolute;top:calc(52px + var(--capH) + var(--ph)*.16);width:min(250px,calc(50vw - var(--pw)/2 + 70px));display:none;z-index:4;pointer-events:none}
#card.R{left:calc(50% + var(--pw)/2 - 70px)}
#card.L{right:calc(50% + var(--pw)/2 - 70px);--dx:90px}
#card.L .cd{transform:perspective(900px) rotateY(9deg)}
#card.L .cd::before{left:auto;right:-44px;background:linear-gradient(270deg,transparent,#ff2bd6)}
[data-m=ph] #card,[data-m=sim] #card{display:block}
.cd{position:relative;padding:16px 18px;border-radius:18px;background:linear-gradient(150deg,rgba(44,14,78,.88),rgba(16,6,34,.9));border:1.5px solid #ff2bd6;backdrop-filter:blur(14px);box-shadow:0 0 34px rgba(255,43,214,.45),inset 0 0 22px rgba(255,43,214,.18);animation:pop .45s cubic-bezier(.2,.9,.3,1.2);font-size:clamp(11.5px,3.1vw,13.5px);line-height:1.45;transform:perspective(900px) rotateY(-9deg)}
.cd::before{content:'';position:absolute;left:-44px;top:50%;width:44px;height:2px;background:linear-gradient(90deg,transparent,#ff2bd6);box-shadow:0 0 10px #ff2bd6}
.cd,#chips span{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,160,240,.09) 40%,rgba(139,92,246,.14));border:1px solid rgba(255,255,255,.34);-webkit-backdrop-filter:blur(16px) saturate(190%) brightness(1.12);backdrop-filter:blur(16px) saturate(190%) brightness(1.12);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.12),inset 0 0 28px rgba(255,255,255,.1),0 14px 40px rgba(0,0,0,.45),0 0 34px rgba(255,43,214,.28)}
.cd::after,#chips span::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 70% at 18% 0%,rgba(255,255,255,.38),transparent 55%),linear-gradient(115deg,transparent 60%,rgba(255,255,255,.14))}
.cd{border-radius:24px;text-shadow:0 1px 8px rgba(20,0,40,.45)}
.l{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14)}.l.me{background:rgba(255,43,214,.28)}
.hd{display:flex;gap:12px;align-items:center;font-weight:800;font-size:17px;line-height:1.2}
.hd svg{width:32px;height:32px;flex:none;stroke:#ff2bd6;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px #ff2bd6)}
@keyframes pop{from{opacity:0;transform:translateX(var(--dx,-90px)) scale(.5)}}
.cd>*{margin:0 0 9px;opacity:0;animation:up .35s forwards}
.cd>:last-child{margin:0}
.l{padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.08)}
.l.me{background:rgba(255,43,214,.22)}
.big{font-weight:700;font-size:1.15em;line-height:1.3}
.rec{color:#fff;background:linear-gradient(90deg,var(--vio),var(--mag));padding:7px 12px;border-radius:10px;font-weight:600;font-size:.92em;display:inline-block}
.okb{color:var(--ok);font-weight:800}
.bar{height:9px;border-radius:9px;background:linear-gradient(90deg,var(--vio),var(--mag));transition:width 1s}
.cd button{pointer-events:auto;font:600 13px inherit;font-family:inherit;color:#fff;background:var(--vio);border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
.rain{height:34px;border-radius:8px;background:repeating-linear-gradient(105deg,transparent 0 8px,rgba(180,190,255,.55) 8px 9px);background-size:20px 20px;animation:rn .5s linear infinite}
@keyframes rn{to{background-position:-10px 20px}}
.chips span{display:inline-block;margin:0 6px 6px 0;padding:6px 10px;border-radius:99px;border:1px solid var(--mag);font-size:.9em}
/* caption */
#cap{position:absolute;left:50%;top:0;height:calc(44px + var(--capH));box-sizing:border-box;padding-top:26px;transform:translateX(-50%);width:min(560px,92vw);flex-direction:column;justify-content:center;text-align:center;z-index:5;display:none;pointer-events:none}
[data-m=ph] #cap,[data-m=sim] #cap,[data-m=brain] #cap{display:flex}
#cap h2{margin:0 0 8px;font-size:clamp(18px,5vw,28px);font-weight:800;letter-spacing:-.01em;animation:up .7s}
#cap p{margin:0;color:#e3d6ff;font-size:clamp(12.5px,3.5vw,16px);line-height:1.5;animation:up .8s .15s both}
#sim{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut);display:none}
[data-m=ph] #sim,[data-m=sim] #sim{display:block}
/* brain */
#brain{position:absolute;inset:calc(44px + var(--capH)) 0 64px 0;display:none;align-items:center;justify-content:center;transition:all 1s}
[data-m=brain] #brain{display:flex}
[data-m=brain].burst #brain{opacity:0;transform:scale(2.4);pointer-events:none}
#brain svg{width:min(640px,98vw);max-height:100%;overflow:visible}
.flow{stroke-dasharray:4 10;animation:fw 1s linear infinite}
@keyframes fw{to{stroke-dashoffset:-14}}
#brain .core{animation:pulse 1.2s infinite;transform-origin:270px 200px}
#status{position:absolute;bottom:2%;font-size:15px;color:#ffd3f6;text-shadow:0 0 14px var(--mag)}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#fff 0,var(--mag) 18%,transparent 60%);opacity:0;pointer-events:none;z-index:8}
.burst #flash{animation:fs 1.4s}
@keyframes fs{20%{opacity:1}to{opacity:0}}
#chips{position:absolute;left:0;right:0;top:calc(44px + var(--capH));height:var(--ph);pointer-events:none;display:none}
.burst #chips{display:block}
#chips span{position:absolute;width:min(190px,calc(50vw - var(--pw)/2 + 70px));text-align:center;padding:10px 12px;border-radius:14px;font-size:clamp(11.5px,3.1vw,13.5px);font-weight:600;background:rgba(139,92,246,.3);border:1px solid var(--mag);backdrop-filter:blur(10px);box-shadow:0 0 30px rgba(255,43,214,.4);animation:pop 1s backwards}
@media(max-width:760px){
.cd{padding:10px 12px}.cd::before{display:none}
.hd svg{width:26px;height:26px}.l{padding:6px 9px}.rec{padding:5px 9px}
}
@supports not (height:100dvh){:root{--ph:min(calc(100vh - var(--capH) - 118px),640px,122vw)}}
@media(orientation:landscape) and (max-height:480px){#stage::after{content:'Gire o aparelho para a vertical para ver a experiência.';position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;background:#07030fee;z-index:20;font-size:15px;pointer-events:none}}
/* As animações mantêm a duração original em dispositivos com preferência de movimento reduzido. */
</style>
</head>
<body>
<div id="stage" data-m="intro">
<canvas id="cv"></canvas><div id="bar"></div><div id="sec"></div>
<div id="intro"></div>
<div id="brain"><svg id="bsvg" viewBox="0 0 540 400"></svg><div id="status"></div></div>
<div id="pw"><div id="phone"><div id="scr"><div id="sb"><span>9:41</span><span>5G<i></i></span></div><div id="app"></div><div id="tb"></div></div></div></div>
<div id="card"></div><div id="chips"></div><div id="flash"></div>
<div id="cap"></div>
<button class="nav" id="prev" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button class="nav" id="next" aria-label="Avançar"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
<div id="foot"></div>
<div id="hint">Toque para continuar</div>
</div>
<audio id="bgMusic" src="trilha-horaly.mp3" loop preload="auto"></audio>
<script>

 if(!c){card.innerHTML='';return}
 let k=0,d=()=>`style="animation-delay:${.1+(k++)*.3}s"`,o='';
 if(t)o+=`<div class="hd" ${d()}>${IC[ICN[i]]||''}</div>`;
 if(c.rain)o+=`<div class="rain" ${d()}></div>`;
 (c.l||[]).forEach(x=>o+=`<div class="l ${x[1]||''}" ${d()}>${x[0]}</div>`);
 (c.bars||[]).forEach(b=>o+=`<div ${d()}>${b[0]}<div class="bar" style="width:${b[1]}%"></div></div>`);
 if(c.big)o+=`<div class="big" ${d()}>${c.big}</div>`;
 if(c.rec)o+=`<div ${d()}><span class="rec">${c.rec}</span></div>`;
 if(c.ok)o+=`<div class="okb" ${d()}>✓ ${c.ok}</div>`;
 if(c.chips)o+=`<div class="chips" ${d()}>${c.chips.map(x=>`<span>${x}</span>`).join('')}</div>`;
 if(c.btn)o+=`<div ${d()}><button id="cb">${c.btn[0]}</button></div>`;
 card.innerHTML=`<div class="cd">${o}</div>`;
 if(c.btn)$('#cb').onclick=e=>{e.stopPropagation();setApp(c.btn[1]);e.target.outerHTML='<span class="okb">✓ Proposta aplicada na visualização</span>'};
}
function draw(){
 const s=S[i];stage.dataset.m=s.m;stage.classList.remove('burst');setCard();card.className=i%2?'L':'R';
 $('#bar').style.width=(i+1)/S.length*100+'%';$('#prev').classList.toggle('off',i===0);$('#next').classList.toggle('off',i===0||i===S.length-1);
 if(s.sec)$('#sec').textContent=s.sec;
 if(s.m==='intro'||s.m==='end'){
  let L=s.L;
  intro.innerHTML=L.map((x,k)=>{const d=`style="animation-delay:${x[0]==='b'?.3+(k-1)*1.5+1:.3+k*1.5}s"`;return x[0]===''?`<div ${d}>${x[1]}</div>`:x[0]==='b'?`<div ${d}>${x[1]}</div>`:x[0]==='h1'?`<h1 ${d}>${x[1]}</h1>`:`<p class="${x[0]}" ${d}>${x[1]}</p>`}).join('');
  const g=$('#go');if(g)g.onclick=e=>{e.stopPropagation();next()};const w=$('#site');if(w)w.onclick=e=>e.stopPropagation();
  if(s.bg)['09h00 Confirmado','10h30 Cliente atrasado','Vaga disponível','Cancelamento'].forEach((t,k)=>{const e=document.createElement('div');e.className='fl';e.textContent=t;e.style.cssText=`${k%2?'right':'left'}:4%;top:${[8,16,80,88][k]}%;animation-delay:${-k*1.3}s`;intro.appendChild(e)});
  if($('#rs'))$('#rs').onclick=e=>{e.stopPropagation();go(0)};$('#hint').style.display=i===S.length-1?'none':'';
 }else if(s.m==='ph'){
  if(prev==='intro'||prev==='end'){phone.classList.remove('enter');void phone.offsetWidth;phone.classList.add('enter')}
  setApp(s.app);setCap(s.t,s.h);
  later(()=>setCard(s.card,s.t),i===3?1500:350);
  if(s.after)later(()=>setApp(s.after[1]),s.after[0]*.55);
 }else if(s.m==='brain')brain();
 else if(s.m==='sim')step();
 prev=s.m;
}
function step(){
 const x=S[i].steps[st];setApp(x.app);setCap(x.t,x.h);setCard(x.card);
 if(st<S[i].steps.length-1)later(next,x.ms||3200);
}
function brain(){
 setCap('Todas as ferramentas, uma inteligência.','Agora imagine tudo isso trabalhando junto.');setApp(A());
 const M=['Analisando históricos…','Comparando durações…','Verificando clima e trânsito…','Identificando conflitos…','Encontrando oportunidades…'];
 M.forEach((m,k)=>later(()=>{$('#status').textContent=m},500+k*1100));
 later(()=>{setCap('Todas as ferramentas, uma inteligência.','Eu conecto informações sobre sua agenda, seus clientes, a duração dos serviços e as condições externas para encontrar padrões, antecipar riscos e identificar oportunidades.')},1500);
 later(burst,6600);
}
function burst(){
 T.forEach(clearTimeout);T=[];stage.classList.add('burst');
 setCap('Informações que se transformam em decisões inteligentes.','Encontrei algumas coisas importantes na agenda da Patrícia. Vou mostrar para você.');
 const P=[[4,14],[2,44],[5,70],[74,18],[76,50],[70,74]],N=['Conflito de horários','Atraso recorrente','Clima e trânsito','Vaga na lista de espera','Sugestão de otimização'];
 $('#chips').innerHTML=N.map((n,k)=>`<span style="${k%2?'left':'right'}:calc(50% + var(--pw)/2 - 70px);top:${[2,18,36,54,72][k]}%;animation-delay:${k*.15}s">${n}</span>`).join('');
 st=1;
}
function next(){
 T.forEach(clearTimeout);T=[];const s=S[i];
 if(s.m==='brain'&&st<1){burst();return}
 if(s.m==='sim'&&st<s.steps.length-1){st++;step();return}
 go(i+1);
}
function go(n){T.forEach(clearTimeout);T=[];i=Math.max(0,Math.min(S.length-1,n));st=0;if(i<S.length-1)$('#hint').style.display='';draw()}
$('#prev').onclick=e=>{e.stopPropagation();go(i-1)};$('#next').onclick=e=>{e.stopPropagation();if(i<S.length-1)next()};
let tx=0,ty=0,sw=0;
stage.addEventListener('click',()=>{if(Date.now()-sw<400)return;if(i<S.length-1)next()});
stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){sw=Date.now();if(dx<0){if(i<S.length-1)next()}else go(i-1)}},{passive:true});
addEventListener('keydown',e=>{if(['ArrowRight',' ','Enter'].includes(e.key)&&i<S.length-1)next();if(e.key==='ArrowLeft')go(i-1)});
/* cérebro */
(function(){let o='',P=[];for(let k=0;k<44;k++){const a=Math.random()*6.28,r=Math.sqrt(Math.random());P.push([270+Math.cos(a)*r*82,200+Math.sin(a)*r*64])}
const tools=['Agenda','Clientes','Histórico','Duração','Clima','Trânsito','Lista de espera','Lembretes'];
tools.forEach((t,k)=>{const a=k/8*6.28-1.57,x=270+Math.cos(a)*205,y=200+Math.sin(a)*168;o+=`<line class="flow" x1="${x}" y1="${y}" x2="270" y2="200" stroke="${k%2?'#8b5cf6':'#ff2bd6'}" stroke-width="1.8"/><rect x="${x-52}" y="${y-15}" width="104" height="30" rx="15" fill="#1d0c3a" stroke="#ff2bd6" stroke-opacity=".7"/><text x="${x}" y="${y+5}" text-anchor="middle" fill="#f4eefe" font-size="14" font-weight="600" font-family="Plus Jakarta Sans,sans-serif">${t}</text>`});
o+='<g class="core">';
P.forEach((p,a)=>P.forEach((q,b)=>{if(b>a&&Math.hypot(p[0]-q[0],p[1]-q[1])<30)o+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="#ff2bd6" stroke-opacity=".55"/>`}));
P.forEach(p=>o+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.8" fill="#ffd3f6"/>`);o+='</g>';
$('#bsvg').innerHTML=o})();
/* partículas e circuitos */
const cv=$('#cv'),cx=cv.getContext('2d');let pts=[],ps=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight;pts=Array.from({length:innerWidth<760?36:70},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.6+.4,v:Math.random()*.3+.05,c:Math.random()<.5?'255,43,214':'139,92,246'}));
 const g=48;ps=[];for(let k=0;k<(innerWidth<760?12:20);k++){let x=Math.round(Math.random()*cv.width/g)*g,y=Math.round(Math.random()*cv.height/g)*g,q=[[x,y]],hz=Math.random()<.5,sg=[],L=0;
 for(let s=0;s<4;s++){const l=(1+Math.floor(Math.random()*4))*g*(Math.random()<.5?-1:1);if(hz)x+=l;else y+=l;q.push([x,y]);hz=!hz}
 for(let a=1;a<q.length;a++){const d=Math.abs(q[a][0]-q[a-1][0])+Math.abs(q[a][1]-q[a-1][1]);sg.push(d);L+=d}
 ps.push({q,sg,L,t:Math.random(),sp:.0005+Math.random()*.001,c:k%2?'255,43,214':'139,92,246'})}}
rs();addEventListener('resize',rs);
function at(p){let d=p.t*p.L;for(let a=0;a<p.sg.length;a++){if(d<=p.sg[a]){const u=d/p.sg[a],A=p.q[a],B=p.q[a+1];return[A[0]+(B[0]-A[0])*u,A[1]+(B[1]-A[1])*u]}d-=p.sg[a]}return p.q[p.q.length-1]}
let lastFrame=null;
(function f(now){const timestamp=typeof now==='number'?now:performance.now();const frames=lastFrame===null?1:Math.min(Math.max((timestamp-lastFrame)/(1000/60),0),3);lastFrame=timestamp;cx.clearRect(0,0,cv.width,cv.height);cx.shadowBlur=0;
 ps.forEach(p=>{cx.strokeStyle=`rgba(${p.c},.3)`;cx.lineWidth=1.2;cx.beginPath();p.q.forEach((a,k)=>k?cx.lineTo(a[0],a[1]):cx.moveTo(a[0],a[1]));cx.stroke();
  const e=p.q[p.q.length-1];cx.fillStyle=`rgba(${p.c},.8)`;cx.beginPath();cx.arc(e[0],e[1],3,0,6.28);cx.fill();
  p.t=(p.t+p.sp*frames)%1;const m=at(p);cx.shadowBlur=14;cx.shadowColor=`rgb(${p.c})`;cx.fillStyle='#fff';cx.beginPath();cx.arc(m[0],m[1],2.2,0,6.28);cx.fill();cx.shadowBlur=0});
 pts.forEach(p=>{p.y-=p.v*.35*frames;if(p.y<0)p.y=cv.height;cx.fillStyle=`rgba(${p.c},.75)`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);cx.fill()});requestAnimationFrame(f)})();
draw();
</script>
</body>
